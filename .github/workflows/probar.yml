name: Probar cuentas

on:
  workflow_dispatch:
    inputs:
      usuarios:
        description: "Usuarios de TikTok separados por espacio"
        default: "tiktok"
      modo:
        description: "probar, crudo, explorar, explorar_ig o meta"
        default: "probar"

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar
        run: |
          mkdir -p /tmp/out
          if [ "${{ github.event.inputs.modo }}" = "oembed" ]; then
            for u in ${{ github.event.inputs.usuarios }}; do echo "== $u"; curl -s -i -m 20 -H "Origin: https://cdizquierdoc-hub.github.io" "https://www.tiktok.com/oembed?url=https://www.tiktok.com/@$u" | grep -iE "^HTTP|access-control|^\{" | cut -c1-400; echo; done 2>&1 | tee /tmp/out/resultado.txt
          elif [ "${{ github.event.inputs.modo }}" = "oembed_video" ]; then
            for u in ${{ github.event.inputs.usuarios }}; do echo "== $u"; r=$(curl -s -m 20 -H "Origin: https://cdizquierdoc-hub.github.io" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36" "https://www.tiktok.com/oembed?url=https://www.tiktok.com/@$u"); echo "${r:0:300}"; t=$(echo "$r" | python3 -c "import json,sys; print(json.load(sys.stdin).get('thumbnail_url',''))" 2>/dev/null); echo "thumb: $t"; [ -n "$t" ] && curl -s -I -m 20 -H "Origin: https://cdizquierdoc-hub.github.io" "$t" | grep -iE "^HTTP|access-control|content-type|expires|cache-control"; echo; done 2>&1 | tee /tmp/out/resultado.txt
          elif [ "${{ github.event.inputs.modo }}" = "ntfy" ]; then
            T="${{ github.event.inputs.usuarios }}"
            { curl -s -i -X POST -H "Origin: https://cdizquierdoc-hub.github.io" -H "Content-Type: text/plain" -d '{"prueba":true,"nombre":"Ñandú Pérez"}' "https://ntfy.sh/$T" | head -20; echo; sleep 2;
              curl -s "https://ntfy.sh/$T/json?poll=1&since=all"; } 2>&1 | tee /tmp/out/resultado.txt
          elif [ "${{ github.event.inputs.modo }}" = "meta" ]; then
            IG_TOKEN="${{ secrets.IG_TOKEN }}" python3 probar_meta.py ${{ github.event.inputs.usuarios }} 2>&1 | tee /tmp/out/resultado.txt
          elif [ "${{ github.event.inputs.modo }}" = "explorar_ig" ]; then
            python3 explorar_ig.py ${{ github.event.inputs.usuarios }} 2>&1 | tee /tmp/out/resultado.txt
          elif [ "${{ github.event.inputs.modo }}" = "perfil_crudo" ]; then
            python3 diag_perfil.py ${{ github.event.inputs.usuarios }} 2>&1 | tee /tmp/out/resultado.txt
          elif [ "${{ github.event.inputs.modo }}" = "explorar" ]; then
            python3 explorar.py ${{ github.event.inputs.usuarios }} 2>&1 | tee /tmp/out/resultado.txt
          else
            python3 monitor.py ${{ github.event.inputs.modo || 'probar' }} ${{ github.event.inputs.usuarios }} | tee /tmp/out/resultado.txt
          fi
      - name: Guardar resultado en la rama "pruebas"
        run: |
          git config user.name "monitor-lives"; git config user.email "monitor-lives@users.noreply.github.com"
          git checkout -q --orphan pruebas && git rm -rq --cached . && cp /tmp/out/resultado.txt .
          git add resultado.txt && git commit -qm "prueba $(date -u +%FT%TZ)" && git push -qf origin pruebas
