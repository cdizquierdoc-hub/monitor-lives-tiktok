name: Probar cuentas

on:
  workflow_dispatch:
    inputs:
      usuarios:
        description: "Usuarios de TikTok separados por espacio"
        default: "tiktok"
      modo:
        description: "probar, crudo, explorar, explorar_ig o meta"
        default: "probar"

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar
        run: |
          mkdir -p /tmp/out
          if [ "${{ github.event.inputs.modo }}" = "ntfy" ]; then
            T="${{ github.event.inputs.usuarios }}"
            { curl -s -i -X POST -H "Origin: https://cdizquierdoc-hub.github.io" -H "Content-Type: text/plain" -d '{"prueba":true,"nombre":"Ñandú Pérez"}' "https://ntfy.sh/$T" | head -20; echo; sleep 2;
              curl -s "https://ntfy.sh/$T/json?poll=1&since=all"; } 2>&1 | tee /tmp/out/resultado.txt
          elif [ "${{ github.event.inputs.modo }}" = "meta" ]; then
            IG_TOKEN="${{ secrets.IG_TOKEN }}" python3 probar_meta.py ${{ github.event.inputs.usuarios }} 2>&1 | tee /tmp/out/resultado.txt
          elif [ "${{ github.event.inputs.modo }}" = "explorar_ig" ]; then
            python3 explorar_ig.py ${{ github.event.inputs.usuarios }} 2>&1 | tee /tmp/out/resultado.txt
          elif [ "${{ github.event.inputs.modo }}" = "explorar" ]; then
            python3 explorar.py ${{ github.event.inputs.usuarios }} 2>&1 | tee /tmp/out/resultado.txt
          else
            python3 monitor.py ${{ github.event.inputs.modo || 'probar' }} ${{ github.event.inputs.usuarios }} | tee /tmp/out/resultado.txt
          fi
      - name: Guardar resultado en la rama "pruebas"
        run: |
          git config user.name "monitor-lives"; git config user.email "monitor-lives@users.noreply.github.com"
          git checkout -q --orphan pruebas && git rm -rq --cached . && cp /tmp/out/resultado.txt .
          git add resultado.txt && git commit -qm "prueba $(date -u +%FT%TZ)" && git push -qf origin pruebas
